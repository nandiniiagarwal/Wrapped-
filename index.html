<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrapped - Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-card">
    
    <div class="brand-header">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
      <h1>Wrapped</h1>
    </div>


    <div class="album-art-container">
      <img id="cover-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=80" alt="Album Cover">
    </div>

    <div class="track-info">
      <div id="track-title" class="track-title">Soundtrack 01</div>
      <div id="track-artist" class="track-artist">Artist 01</div>
    </div>


    <div class="progress-container">
      <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" max="100">
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="total-duration">0:00</span>
      </div>
    </div>


    <div class="controls">
      <!-- Shuffle -->
      <button id="shuffle-btn" class="btn" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>

      <!-- Previous -->
      <button id="prev-btn" class="btn" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <!-- Play / Pause -->
      <button id="play-btn" class="btn btn-play" title="Play">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <!-- Next -->
      <button id="next-btn" class="btn" title="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <!-- Repeat -->
      <button id="repeat-btn" class="btn" title="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-container">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <input type="range" id="volume-slider" class="volume-slider" value="80" min="0" max="100">
    </div>

    <!-- Local File Upload -->
    <div class="upload-container">
      <label for="file-input" class="file-label">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>Add Local Audio Files</span>
      </label>
      <input type="file" id="file-input" accept="audio/*" multiple>
    </div>

    <!-- Playlist -->
    <div class="playlist-section">
      <div class="playlist-header">
        <span>Up Next</span>
        <span id="playlist-count" class="playlist-count">0 tracks</span>
      </div>
      <ul id="playlist" class="playlist"></ul>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="form-container">
        <h2>Student Registration</h2>
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="useremail">Email Address:</label>
                <input type="email" id="useremail" name="useremail" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="userpassword">Password:</label>
                <input type="password" id="userpassword" name="userpassword" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>-- Choose a course --</option>
                    <option value="btech">B.Tech (CSE)</option>
                    <option value="bca">BCA</option>
                    <option value="mtech">M.Tech</option>
                    <option value="mca">MCA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Interests:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="coding" name="interests" value="coding">
                    <label for="coding">Coding</label>

                    <input type="checkbox" id="designing" name="interests" value="designing">
                    <label for="designing">Designing</label>

                    <input type="checkbox" id="gaming" name="interests" value="gaming">
                    <label for="gaming">Gaming</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I accept the terms and conditions</label>
                </div>
            </div>

            <button type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
